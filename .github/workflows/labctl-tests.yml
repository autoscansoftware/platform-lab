name: labctl-tests
on:
  push:
    paths: ["labctl/**", ".github/workflows/labctl-tests.yml"]
  pull_request:
    paths: ["labctl/**", ".github/workflows/labctl-tests.yml"]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s labctl/tests -v

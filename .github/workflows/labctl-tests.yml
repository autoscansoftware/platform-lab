name: labctl-tests
on:
  push:
    paths: ["labctl/**", ".github/workflows/labctl-tests.yml"]
  pull_request:
    paths: ["labctl/**", ".github/workflows/labctl-tests.yml"]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s labctl/tests -v

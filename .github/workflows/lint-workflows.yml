name: lint-workflows
on:
  pull_request:
    paths: [".github/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: actionlint (pinned, checksum verified)
        run: |
          set -eux
          v=1.7.12
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_${v}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${v}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
      - name: zizmor (pinned)
        run: |
          python -m pip install --quiet zizmor==1.33.1
          zizmor --config .github/zizmor.yml --format plain .github/workflows

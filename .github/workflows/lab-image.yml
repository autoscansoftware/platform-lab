name: lab-image
on:
  push:
    paths:
      - "docker/lab/**"
      - ".github/workflows/lab-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/autoscansoftware/lab

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/autoscansoftware/lab
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: docker/lab
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -eux
          img="${IMAGE}:sha-$(git rev-parse --short=7 HEAD)"
          docker pull "$img"
          docker manifest inspect "$img" | jq '[.layers[].size] | add' || true
          docker run --rm --entrypoint bash "$img" -c 'python3 --version; node --version; git --version; chromium --version; docker --version'
          cid=$(docker run -d -e LAB_VNC_PASSWORD=smoketest "$img")
          sleep 20
          docker exec "$cid" curl -fsS -o /dev/null -w "noVNC http %{http_code}\n" http://127.0.0.1:6080/vnc.html
          docker logs "$cid"
          docker rm -f "$cid"

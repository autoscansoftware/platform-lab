name: lab-image
on:
  push:
    branches: [main]
    paths:
      - "docker/lab/**"
      - ".github/workflows/lab-image.yml"
  pull_request:
    paths:
      - "docker/lab/**"
      - ".github/workflows/lab-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/autoscansoftware/lab

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/autoscansoftware/lab
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/lab
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eux
          img="${IMAGE}:latest"
          if [ "$EVENT" != "pull_request" ]; then docker pull "$img"; fi
          docker run --rm --entrypoint bash "$img" -c 'python3 --version; node --version; git --version; chromium --version; docker --version'
          cid=$(docker run -d -p 127.0.0.1:6080:6080 -e LAB_VNC_PASSWORD=smoketest "$img")
          sleep 20
          # reached from the HOST through the published loopback port
          curl -fsS -o /dev/null -w "noVNC http %{http_code}\n" http://127.0.0.1:6080/vnc.html
          # raw VNC must stay inside the container: Xtigervnc started with -localhost
          docker exec "$cid" pgrep -a Xtigervnc | grep -q -- "-localhost"
          # password file: mode 600, owned by lab, never in the logs
          test "$(docker exec "$cid" stat -c '%a %U' /home/lab/.vnc/passwd-plain)" = "600 lab"
          if docker logs "$cid" 2>&1 | grep -q smoketest; then echo "password leaked into logs"; exit 1; fi
          docker logs "$cid"
          docker rm -f "$cid"
